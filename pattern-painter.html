<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Painter — Lecture 11</title>
<style>
  :root {
    --navy: #1F3A5F;
    --navy-dark: #16283F;
    --orange: #E8842C;
    --orange-light: #F5A25D;
    --green: #2E7D32;
    --green-tint: #E8F5E9;
    --red: #C62828;
    --red-tint: #FDECEA;
    --light: #F5F7FA;
    --border: #D7DEE8;
    --ink: #2B2B2B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    color: var(--ink);
  }
  .app { width: 100%; max-width: 480px; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 6px 2px 14px 2px;
  }
  .top .brand { font-weight: 800; letter-spacing: 1px; font-size: 14px; }
  .top .brand span { color: var(--orange-light); }
  .top .score { font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.12); padding: 6px 12px; border-radius: 999px; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .progress { display: flex; gap: 6px; margin-bottom: 16px; }
  .progress div { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .progress div.done { background: var(--orange); }
  .qlabel { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--orange); margin-bottom: 6px; }
  .question { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
  pre.code {
    background: var(--navy-dark); color: #fff; border-radius: 12px;
    padding: 14px 16px; font-family: "Consolas", "Menlo", monospace;
    font-size: 13.5px; line-height: 1.55; overflow-x: auto; margin-bottom: 16px;
  }
  pre.pattern {
    background: var(--light); color: var(--navy); border: 2px solid var(--border);
    border-radius: 12px; padding: 14px 16px; font-family: "Consolas", "Menlo", monospace;
    font-size: 16px; line-height: 1.5; font-weight: 700; overflow-x: auto; margin-bottom: 16px;
  }
  .opts { display: grid; gap: 10px; }
  .opt {
    width: 100%; text-align: left; background: var(--light);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; transition: border-color 0.15s;
  }
  .opt pre {
    font-family: "Consolas", "Menlo", monospace; font-size: 13px; line-height: 1.5;
    color: var(--navy); font-weight: 600; overflow-x: auto; background: none;
  }
  .opt .tag { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--orange); display: block; margin-bottom: 4px; }
  .opt:active { border-color: var(--navy); }
  .opt.correct { background: var(--green-tint); border-color: var(--green); }
  .opt.correct pre { color: var(--green); }
  .opt.wrong { background: var(--red-tint); border-color: var(--red); }
  .opt.wrong pre { color: var(--red); }
  .opt:disabled { cursor: default; }
  .feedback { display: none; margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .feedback.good { display: block; background: var(--green-tint); color: var(--green); font-weight: 600; }
  .feedback.bad { display: block; background: var(--red-tint); color: var(--red); font-weight: 600; }
  .next {
    display: none; width: 100%; margin-top: 14px; background: var(--navy); color: #fff;
    border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .center { text-align: center; }
  .big { font-size: 44px; font-weight: 900; color: var(--navy); margin: 10px 0; }
  .msg { font-size: 16px; color: var(--ink); margin-bottom: 18px; }
  .start-title { font-size: 26px; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
  .rules { text-align: left; margin: 16px 0 20px 0; padding-left: 18px; color: var(--ink); font-size: 15px; line-height: 1.7; }
  .go {
    width: 100%; background: var(--orange); color: #fff; border: none; border-radius: 12px;
    padding: 15px; font-size: 17px; font-weight: 800; cursor: pointer;
  }
  .tag2 { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--orange); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">PATTERN <span>PAINTER</span></div>
    <div class="score" id="scorebox">Score: 0</div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
// mode "c2p": show code, pick the pattern it paints
// mode "p2c": show pattern, pick the code that paints it
var rounds = [
  {
    mode: "c2p",
    show: 'for i in range(3):\n    for j in range(3):\n        print("*", end="")\n    print()',
    options: ["***\n***\n***", "*\n*\n*\n*\n*\n*\n*\n*\n*", "*********"],
    answer: 0,
    why: "Outer loop = 3 rows, inner loop = 3 stars per row, print() ends each row. A 3\u00D73 block."
  },
  {
    mode: "p2c",
    show: "*****",
    options: [
      'for j in range(5):\n    print("*", end="")\nprint()',
      'for j in range(5):\n    print("*")',
      'for j in range(5):\n    print("*", end=" ")\nprint()'
    ],
    answer: 0,
    why: "end=\"\" keeps the stars on one line with no gaps. The second stacks them vertically, the third adds spaces."
  },
  {
    mode: "c2p",
    show: 'for i in range(1, 5):\n    for j in range(i):\n        print("*", end="")\n    print()',
    options: ["*\n**\n***\n****", "****\n***\n**\n*", "****\n****\n****\n****"],
    answer: 0,
    why: "The inner loop depends on i: row 1 gets 1 star, row 4 gets 4 stars \u2014 a growing triangle."
  },
  {
    mode: "p2c",
    show: "1\n1 2\n1 2 3",
    options: [
      'for i in range(1, 4):\n    for j in range(1, i + 1):\n        print(j, end=" ")\n    print()',
      'for i in range(1, 4):\n    for j in range(1, i + 1):\n        print(i, end=" ")\n    print()',
      'for i in range(1, 4):\n    for j in range(i):\n        print(j, end=" ")\n    print()'
    ],
    answer: 0,
    why: "Each row counts 1 up to i \u2014 so print j, with the inner range ending at i + 1. Printing i would give 1 / 2 2 / 3 3 3."
  },
  {
    mode: "c2p",
    show: 'for i in range(3):\n    for j in range(3):\n        print(i, end="")\n    print()',
    options: ["000\n111\n222", "012\n012\n012", "000111222"],
    answer: 0,
    why: "It prints i, the row number \u2014 so every row repeats its own number three times."
  },
  {
    mode: "p2c",
    show: "****\n***\n**\n*",
    options: [
      'for i in range(4, 0, -1):\n    for j in range(i):\n        print("*", end="")\n    print()',
      'for i in range(1, 5):\n    for j in range(i):\n        print("*", end="")\n    print()',
      'for i in range(4):\n    for j in range(4):\n        print("*", end="")\n    print()'
    ],
    answer: 0,
    why: "range(4, 0, -1) counts down 4, 3, 2, 1 \u2014 so the rows shrink. The inner loop stays range(i)."
  },
  {
    mode: "c2p",
    show: 'm = [[1, 2], [3, 4]]\nfor row in m:\n    for n in row:\n        print(n, end=" ")\n    print()',
    options: ["1 2\n3 4", "1 3\n2 4", "1 2 3 4"],
    answer: 0,
    why: "The outer loop walks the rows in order, so the matrix prints exactly as it is written."
  },
  {
    mode: "p2c",
    show: "  *\n ***\n*****",
    options: [
      'for i in range(1, 4):\n    for s in range(3 - i):\n        print(" ", end="")\n    for j in range(2 * i - 1):\n        print("*", end="")\n    print()',
      'for i in range(1, 4):\n    for j in range(2 * i - 1):\n        print("*", end="")\n    print()',
      'for i in range(1, 4):\n    for s in range(i):\n        print(" ", end="")\n    for j in range(2 * i - 1):\n        print("*", end="")\n    print()'
    ],
    answer: 0,
    why: "A pyramid row has two jobs: spaces first (3 - i of them), then stars (2i - 1). Without the space loop it leans left; with range(i) spaces it leans the wrong way."
  }
];

var current = 0;
var score = 0;
var card = document.getElementById('card');
var scorebox = document.getElementById('scorebox');

function shuffleOptions(round) {
  var order = [];
  for (var i = 0; i < round.options.length; i++) { order.push(i); }
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  return order;
}

function esc(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showStart() {
  current = 0;
  score = 0;
  scorebox.textContent = 'Score: 0';
  var html = '';
  html += '<div class="center">';
  html += '<div class="tag2">LECTURE 11 \u00B7 NESTED LOOPS</div>';
  html += '<div class="start-title">Code paints patterns.<br>Can you match them?</div>';
  html += '</div>';
  html += '<ol class="rules">';
  html += '<li>8 rounds of stars, numbers and pyramids</li>';
  html += '<li>Sometimes you see code \u2014 pick the pattern it paints</li>';
  html += '<li>Sometimes you see a pattern \u2014 pick the code that paints it</li>';
  html += '</ol>';
  html += '<button class="go" onclick="showRound()">START</button>';
  card.innerHTML = html;
}

function showRound() {
  var r = rounds[current];
  var order = shuffleOptions(r);
  var html = '';
  html += '<div class="progress">';
  for (var i = 0; i < rounds.length; i++) {
    html += '<div class="' + (i < current ? 'done' : '') + '"></div>';
  }
  html += '</div>';
  html += '<div class="qlabel">ROUND ' + (current + 1) + ' OF ' + rounds.length + '</div>';
  if (r.mode === 'c2p') {
    html += '<div class="question">What does this code paint?</div>';
    html += '<pre class="code">' + esc(r.show) + '</pre>';
  } else {
    html += '<div class="question">Which code paints this pattern?</div>';
    html += '<pre class="pattern">' + esc(r.show) + '</pre>';
  }
  html += '<div class="opts">';
  var letters = ['A', 'B', 'C'];
  for (var i = 0; i < order.length; i++) {
    var idx = order[i];
    html += '<button class="opt" data-idx="' + idx + '" onclick="pick(this)">';
    html += '<span class="tag">' + letters[i] + '</span>';
    html += '<pre>' + esc(r.options[idx]) + '</pre>';
    html += '</button>';
  }
  html += '</div>';
  html += '<div class="feedback" id="feedback"></div>';
  html += '<button class="next" id="next" onclick="nextRound()">' + (current === rounds.length - 1 ? 'SEE MY SCORE' : 'NEXT ROUND') + '</button>';
  card.innerHTML = html;
}

function pick(btn) {
  var r = rounds[current];
  var chosen = parseInt(btn.getAttribute('data-idx'));
  var buttons = card.querySelectorAll('.opt');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
    if (parseInt(buttons[i].getAttribute('data-idx')) === r.answer) {
      buttons[i].classList.add('correct');
    }
  }
  var fb = document.getElementById('feedback');
  if (chosen === r.answer) {
    score = score + 1;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! ' + r.why;
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = 'Not quite. ' + r.why;
  }
  scorebox.textContent = 'Score: ' + score;
  document.getElementById('next').style.display = 'block';
}

function nextRound() {
  current = current + 1;
  if (current < rounds.length) {
    showRound();
  } else {
    showEnd();
  }
}

function showEnd() {
  var msg = '';
  if (score === 8) { msg = 'Perfect! You see the loop behind every shape.'; }
  else if (score >= 6) { msg = 'Strong! The patterns are painting themselves.'; }
  else if (score >= 4) { msg = 'Good eye. The lecture will fill in the rest.'; }
  else { msg = 'Tricky shapes! Play again after the lecture.'; }
  var html = '';
  html += '<div class="center">';
  html += '<div class="tag2">FINAL SCORE</div>';
  html += '<div class="big">' + score + ' / ' + rounds.length + '</div>';
  html += '<div class="msg">' + msg + '</div>';
  html += '<button class="go" onclick="showStart()">PLAY AGAIN</button>';
  html += '</div>';
  card.innerHTML = html;
}

showStart();
</script>
</body>
</html>
