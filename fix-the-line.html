<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix the Line — Lecture 6</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#1F3864;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 30px}
  .kicker{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#ED7D31;font-weight:bold;margin-top:8px}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:2.2rem;margin:.2rem 0 .3rem}
  .sub{color:#C9D2E3;font-size:.95rem;margin:0 0 1rem;text-align:center}
  .card{background:#FBF7F0;color:#1F3864;border-radius:18px;padding:1.2rem 1.2rem 1.4rem;max-width:440px;width:100%}
  .round{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:#ED7D31;font-weight:bold}
  .name{font-family:Georgia,serif;font-size:1.6rem;font-weight:bold;margin:.3rem 0 .8rem}
  .line{display:block;width:100%;text-align:left;background:#fff;border:2px solid #D6DCE8;border-radius:8px;padding:.5rem .7rem;margin:0 0 .45rem;font-family:'Courier New',monospace;font-size:.95rem;white-space:pre;color:#1F3864;cursor:pointer}
  .line:hover{border-color:#ED7D31}
  .line.right{background:#E8F3E9;border-color:#2E7D32}
  .line.wrong{background:#FBE9E7;border-color:#C0392B}
  .line:disabled{cursor:default}
  .err{margin:.6rem 0 .3rem;padding:.7rem;border-radius:10px;background:#FBE9E7;border:1.5px solid #C0392B;font-family:'Courier New',monospace;font-size:.85rem;white-space:pre-wrap;color:#7B1F14}
  .err.silent{background:#FFF4E5;border-color:#ED7D31;color:#7A3E00}
  .ask{margin:.6rem 0;font-weight:bold;color:#ED7D31}
  .verdict{margin-top:.8rem;padding:.8rem;border-radius:10px;font-size:.95rem;line-height:1.5;display:none}
  .verdict.ok{display:block;background:#E8F3E9;border:1.5px solid #2E7D32}
  .verdict.bad{display:block;background:#FBE9E7;border:1.5px solid #C0392B}
  .verdict code{font-family:'Courier New',monospace;background:#fff;padding:0 .25rem;border-radius:4px}
  .next{display:none;width:100%;margin-top:.9rem;border:0;border-radius:12px;padding:.8rem;background:#ED7D31;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer}
  .score{text-align:right;font-weight:bold;margin-top:.8rem;color:#5B667C;font-size:.9rem}
  .foot{margin-top:1.2rem;font-size:.8rem;color:#9FB0CF;text-align:center;line-height:1.6;font-family:'Courier New',monospace}
</style>
</head>
<body>
  <div class="kicker">Lecture 6 · Debugging</div>
  <h1>Fix the Line</h1>
  <p class="sub">Five programs. One bug each. Tap the line that has the bug.</p>

  <div class="card" id="game">
    <div class="round" id="round"></div>
    <div class="name" id="name"></div>
    <div id="lines"></div>
    <div class="err" id="err"></div>
    <div class="ask">Which line has the bug?</div>
    <div class="verdict" id="verdict"></div>
    <button class="next" id="next">Next</button>
    <div class="score" id="score">Score: 0</div>
  </div>

  <div class="foot">Read the last line of the error first. Then go to the line number.<br>Computational Thinking with Programming · 2026CSAE100 · Bennett University</div>

<script>
(function(){
  var V=[
    {name:"Will not run", lines:["marks = 45","if marks >= 40","    print('Pass')"], bug:1, silent:false,
     err:"SyntaxError: expected ':'  (line 2)",
     fix:"Line 2 is missing the colon. Python stops before running anything — a syntax error."},
    {name:"Stops midway", lines:["grade = 'A'","marks = 85","print(grde)"], bug:2, silent:false,
     err:"NameError: name 'grde' is not defined  (line 3)",
     fix:"Line 3 uses <code>grde</code>, which was never defined. Lines 1 and 2 ran fine — a runtime error."},
    {name:"Crashes on input", lines:["marks = input('Marks? ')","if marks >= 40:","    print('Pass')"], bug:0, silent:false,
     err:"TypeError: '>=' not supported between 'str' and 'int'  (line 2)",
     fix:"The error is reported on line 2, but the cause is line 1: input() gives text. Wrap it in <code>int()</code>."},
    {name:"Runs, wrong answer", lines:["marks = 95","if marks >= 40:","    grade = 'C'","elif marks >= 80:","    grade = 'A'","print(grade)"], bug:1, silent:true,
     err:"No error. Output: C   (expected: A)",
     fix:"Nothing crashed. Line 2 checks >= 40 first, so 95 gets C and the elif is never reached — a logical error. Put >= 80 first."},
    {name:"Wrong door", lines:["age = 20","student_id = False","if age >= 18:","    if student_id:","        print('Welcome')","else:","    print('Too young')"], bug:5, silent:true,
     err:"No error. Output: (nothing)   (expected: a message)",
     fix:"Line 6: this else lines up with the OUTER if, so it belongs to the age check. Indent it to belong to the inner if — or add an inner else."}
  ];
  var i=0,score=0,answered=false;
  function $(id){return document.getElementById(id);}
  function show(){
    answered=false; var v=V[i];
    $("round").textContent="Program "+(i+1)+" of "+V.length;
    $("name").textContent=v.name;
    var box=$("lines"); box.innerHTML="";
    for(var k=0;k<v.lines.length;k++){
      var b=document.createElement("button"); b.className="line"; b.textContent=(k+1)+"  "+v.lines[k];
      b.setAttribute("data-k",k); b.addEventListener("click",pick); box.appendChild(b);
    }
    var e=$("err"); e.textContent=v.err; e.className="err"+(v.silent?" silent":"");
    var vd=$("verdict"); vd.className="verdict"; vd.innerHTML="";
    $("next").style.display="none"; $("score").textContent="Score: "+score;
  }
  function pick(ev){
    if(answered) return; answered=true;
    var k=parseInt(ev.currentTarget.getAttribute("data-k"),10), v=V[i], right=(k===v.bug);
    if(right) score++;
    var btns=$("lines").children;
    for(var j=0;j<btns.length;j++){ btns[j].disabled=true; if(j===v.bug) btns[j].classList.add("right"); else if(j===k) btns[j].classList.add("wrong"); }
    var vd=$("verdict"); vd.className="verdict "+(right?"ok":"bad");
    vd.innerHTML=(right?"\u2713 Correct. ":"\u2717 Not that one. ")+v.fix;
    $("next").style.display="block"; $("next").textContent=(i<V.length-1)?"Next":"See my result";
    $("score").textContent="Score: "+score;
  }
  function finish(){
    var line;
    if(score===5) line="All five. You read tracebacks like a pro.";
    else if(score>=3) line="Good. The ones without an error message are the hard ones — that is today's topic.";
    else line="Tough set. Remember: last line of the error says what, the line number says where.";
    $("game").innerHTML='<div class="round">Final score</div><div class="name">'+score+' / 5</div>'+
      '<div style="font-size:.95rem;color:#5B667C;line-height:1.55">'+line+'</div>'+
      '<div style="font-size:.95rem;color:#5B667C;line-height:1.55;margin-top:.6rem">Two of the five had no error message at all. Python cannot find those for you.</div>'+
      '<button class="next" style="display:block" id="replay">Play again</button>';
    $("replay").addEventListener("click",function(){location.reload();});
  }
  $("next").addEventListener("click",function(){ if(i<V.length-1){i++;show();} else finish(); });
  show();
})();
</script>
</body>
</html>
