<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Point — Lab E5</title>
<style>
  :root {
    --navy: #1F3A5F;
    --navy-dark: #16283F;
    --orange: #E8842C;
    --orange-light: #F5A25D;
    --green: #2E7D32;
    --green-tint: #E8F5E9;
    --red: #C62828;
    --red-tint: #FDECEA;
    --light: #F5F7FA;
    --border: #D7DEE8;
    --ink: #2B2B2B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    color: var(--ink);
  }
  .app { width: 100%; max-width: 480px; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; padding: 6px 2px 14px 2px;
  }
  .top .brand { font-weight: 800; letter-spacing: 1px; font-size: 14px; }
  .top .brand span { color: var(--orange-light); }
  .top .score { font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.12); padding: 6px 12px; border-radius: 999px; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .progress { display: flex; gap: 6px; margin-bottom: 16px; }
  .progress div { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .progress div.done { background: var(--orange); }
  .qlabel { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--orange); margin-bottom: 6px; }
  .question { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
  pre {
    background: var(--navy-dark); color: #fff; border-radius: 12px;
    padding: 14px 16px; font-family: "Consolas", "Menlo", monospace;
    font-size: 14px; line-height: 1.55; overflow-x: auto; margin-bottom: 16px;
  }
  pre .kw { color: var(--orange-light); font-weight: 700; }
  .opts { display: grid; gap: 10px; }
  .opt {
    width: 100%; text-align: left; background: var(--light);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; font-family: "Consolas", "Menlo", monospace;
    cursor: pointer; color: var(--navy); font-weight: 600;
    transition: border-color 0.15s;
  }
  .opt:active { border-color: var(--navy); }
  .opt.correct { background: var(--green-tint); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-tint); border-color: var(--red); color: var(--red); }
  .opt:disabled { cursor: default; }
  .feedback {
    display: none; margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5;
  }
  .feedback.good { display: block; background: var(--green-tint); color: var(--green); font-weight: 600; }
  .feedback.bad { display: block; background: var(--red-tint); color: var(--red); font-weight: 600; }
  .next {
    display: none; width: 100%; margin-top: 14px; background: var(--navy); color: #fff;
    border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .center { text-align: center; }
  .big { font-size: 44px; font-weight: 900; color: var(--navy); margin: 10px 0; }
  .msg { font-size: 16px; color: var(--ink); margin-bottom: 18px; }
  .start-title { font-size: 26px; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
  .rules { text-align: left; margin: 16px 0 20px 0; padding-left: 18px; color: var(--ink); font-size: 15px; line-height: 1.7; }
  .go {
    width: 100%; background: var(--orange); color: #fff; border: none; border-radius: 12px;
    padding: 15px; font-size: 17px; font-weight: 800; cursor: pointer;
  }
  .tag { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--orange); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">BREAK <span>POINT</span></div>
    <div class="score" id="scorebox">Score: 0</div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
var rounds = [
  {
    code: 'for i in range(1, 6):\n    if i == 3:\n        <span class="kw">break</span>\n    print(i)',
    options: ["1 2", "1 2 3", "1 2 4 5"],
    answer: 0,
    why: "break runs before print when i is 3, so 3 is never printed and the loop ends."
  },
  {
    code: 'for i in range(1, 6):\n    print(i)\n    if i == 3:\n        <span class="kw">break</span>',
    options: ["1 2", "1 2 3", "1 2 3 4 5"],
    answer: 1,
    why: "This time print runs first — so 3 is printed, and then break ends the loop."
  },
  {
    code: 'for i in range(1, 5):\n    if i == 2:\n        <span class="kw">continue</span>\n    print(i)',
    options: ["1", "1 3 4", "1 2 3 4"],
    answer: 1,
    why: "continue only skips one round. 2 is left out and the loop carries on."
  },
  {
    code: 'for i in range(1, 4):\n    if i == 2:\n        <span class="kw">pass</span>\n    print(i)',
    options: ["1 3", "1 2 3", "1"],
    answer: 1,
    why: "pass does nothing at all — print(i) still runs for every value."
  },
  {
    code: 'for ch in "code":\n    if ch == "d":\n        <span class="kw">break</span>\n    print(ch)',
    options: ["c o d", "c o d e", "c o"],
    answer: 2,
    why: "Loops work on strings letter by letter. break fires at \"d\" before it is printed."
  },
  {
    code: 'n = 0\nwhile True:\n    n = n + 1\n    if n == 3:\n        <span class="kw">break</span>\n    print(n)',
    options: ["1 2", "1 2 3", "runs forever"],
    answer: 0,
    why: "while True is not endless here — break ends it when n reaches 3, before 3 is printed."
  },
  {
    code: 'total = 0\nfor n in [1, -2, 3]:\n    if n < 0:\n        <span class="kw">continue</span>\n    total = total + n\nprint(total)',
    options: ["4", "2", "1 3"],
    answer: 0,
    why: "continue skips -2, so total is 1 + 3 = 4. print is outside the loop — it runs once."
  },
  {
    code: 'for i in range(1, 6):\n    if i % 2 == 0:\n        <span class="kw">continue</span>\n    print(i)',
    options: ["2 4", "1 3 5", "1 2 3 4 5"],
    answer: 1,
    why: "Every even value hits continue and is skipped — only the odd ones get printed."
  }
];

var current = 0;
var score = 0;
var card = document.getElementById('card');
var scorebox = document.getElementById('scorebox');

function shuffleOptions(round) {
  var order = [];
  for (var i = 0; i < round.options.length; i++) { order.push(i); }
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  return order;
}

function showStart() {
  current = 0;
  score = 0;
  scorebox.textContent = 'Score: 0';
  var html = '';
  html += '<div class="center">';
  html += '<div class="tag">LAB E5 \u00B7 LOOP CONTROL</div>';
  html += '<div class="start-title">Where does the loop stop?</div>';
  html += '</div>';
  html += '<ol class="rules">';
  html += '<li>8 short loops with break, continue and pass</li>';
  html += '<li>Read the code, then pick what it prints</li>';
  html += '<li>Trace it in your head before you tap</li>';
  html += '</ol>';
  html += '<button class="go" onclick="showRound()">START</button>';
  card.innerHTML = html;
}

function showRound() {
  var r = rounds[current];
  var order = shuffleOptions(r);
  var html = '';
  html += '<div class="progress">';
  for (var i = 0; i < rounds.length; i++) {
    html += '<div class="' + (i < current ? 'done' : '') + '"></div>';
  }
  html += '</div>';
  html += '<div class="qlabel">ROUND ' + (current + 1) + ' OF ' + rounds.length + '</div>';
  html += '<div class="question">What gets printed?</div>';
  html += '<pre>' + r.code + '</pre>';
  html += '<div class="opts">';
  for (var i = 0; i < order.length; i++) {
    var idx = order[i];
    html += '<button class="opt" data-idx="' + idx + '" onclick="pick(this)">' + r.options[idx] + '</button>';
  }
  html += '</div>';
  html += '<div class="feedback" id="feedback"></div>';
  html += '<button class="next" id="next" onclick="nextRound()">' + (current === rounds.length - 1 ? 'SEE MY SCORE' : 'NEXT ROUND') + '</button>';
  card.innerHTML = html;
}

function pick(btn) {
  var r = rounds[current];
  var chosen = parseInt(btn.getAttribute('data-idx'));
  var buttons = card.querySelectorAll('.opt');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
    if (parseInt(buttons[i].getAttribute('data-idx')) === r.answer) {
      buttons[i].classList.add('correct');
    }
  }
  var fb = document.getElementById('feedback');
  if (chosen === r.answer) {
    score = score + 1;
    fb.className = 'feedback good';
    fb.textContent = 'Correct! ' + r.why;
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = 'Not quite. ' + r.why;
  }
  scorebox.textContent = 'Score: ' + score;
  document.getElementById('next').style.display = 'block';
}

function nextRound() {
  current = current + 1;
  if (current < rounds.length) {
    showRound();
  } else {
    showEnd();
  }
}

function showEnd() {
  var msg = '';
  if (score === 8) { msg = 'Perfect trace! You read loops like Python does.'; }
  else if (score >= 6) { msg = 'Strong! You know exactly where loops stop.'; }
  else if (score >= 4) { msg = 'Good start. The lab slides will tighten this up.'; }
  else { msg = 'Tricky, right? Work through the lab and play again.'; }
  var html = '';
  html += '<div class="center">';
  html += '<div class="tag">FINAL SCORE</div>';
  html += '<div class="big">' + score + ' / ' + rounds.length + '</div>';
  html += '<div class="msg">' + msg + '</div>';
  html += '<button class="go" onclick="showStart()">PLAY AGAIN</button>';
  html += '</div>';
  card.innerHTML = html;
}

showStart();
</script>
</body>
</html>
