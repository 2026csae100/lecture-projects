<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Times Table Sprint — Lecture 10</title>
<style>
  :root { --navy:#1F3864; --orange:#ED7D31; --cream:#FAF5EC; --ink:#1F3864; --grey:#96A0B4; --bord:#D8DCE6; --good:#2E7D32; --bad:#C62828; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body { background:var(--navy); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; color:#fff; }
  .tag { color:var(--orange); font-weight:700; letter-spacing:1px; font-size:14px; margin-top:12px; }
  h1 { font-size:34px; margin:6px 0 4px; }
  .sub { color:#C8D2E6; font-size:15px; margin-bottom:20px; }
  .card { background:var(--cream); color:var(--ink); border-radius:22px; padding:22px 20px 26px; width:100%; max-width:420px; }
  .round { color:var(--orange); font-weight:700; letter-spacing:1px; font-size:14px; margin-bottom:12px; }
  .qbox { background:#fff; border:2px solid var(--bord); border-radius:14px; padding:26px 10px; text-align:center;
          font-family:'Courier New',monospace; font-weight:700; font-size:42px; margin-bottom:14px; }
  .tbar { background:#EBE4D6; border-radius:8px; height:16px; overflow:hidden; margin-bottom:6px; }
  .tfill { background:var(--orange); height:100%; width:100%; }
  .tlbl { color:var(--grey); font-size:14px; margin-bottom:14px; }
  input[type=number] { width:100%; padding:14px; font-size:20px; border:3px solid var(--orange); border-radius:12px; background:#fff; color:var(--ink); outline:none; text-align:center; }
  button { width:100%; margin-top:12px; padding:14px; font-size:17px; font-weight:700; color:#fff; background:var(--orange); border:none; border-radius:12px; cursor:pointer; }
  button:active { transform:scale(.98); }
  .meta { margin-top:14px; font-weight:700; color:#5A6478; font-size:15px; }
  .fb { margin-top:10px; font-weight:700; font-size:15px; min-height:22px; }
  .fb.good { color:var(--good); } .fb.bad { color:var(--bad); }
  .end { text-align:center; padding:10px 0; }
  .end .big { font-size:42px; margin:6px 0; }
  .end h2 { font-size:26px; margin-bottom:8px; }
  .end p { color:#5A6478; margin:8px 0 16px; font-size:15px; line-height:1.5; }
  .code { background:#fff; border:2px solid var(--bord); border-radius:12px; padding:12px 14px; text-align:left; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; margin:12px 0; white-space:pre; overflow-x:auto; }
  .foot { margin-top:22px; text-align:center; color:#C8D2E6; font-size:14px; }
  .foot .small { color:#96A6C8; font-size:13px; margin-top:4px; }
</style>
</head>
<body>
  <div class="tag">LECTURE 10 &middot; THE FOR LOOP</div>
  <h1>Times Table Sprint</h1>
  <div class="sub">Ten questions. Beat the clock.</div>

  <div class="card">
    <div id="play">
      <div class="round" id="roundLbl">QUESTION 1 OF 10</div>
      <div class="qbox" id="qbox">7 &times; 8 = ?</div>
      <div class="tbar"><div class="tfill" id="tfill"></div></div>
      <div class="tlbl" id="tlbl">8 seconds left</div>
      <input type="number" id="ansIn" placeholder="Your answer" inputmode="numeric">
      <button id="goBtn">Answer</button>
      <div class="fb" id="fb"></div>
      <div class="meta" id="scoreLbl">Score: 0</div>
    </div>
    <div id="end" class="end" style="display:none"></div>
  </div>

  <div class="foot">Today you write the table machine<div class="small">2026CSAE100 &middot; Bennett University</div></div>

<script>
var TOTAL = 10, TIME = 8;
var qn, score, a, b, left, timer, waiting;

function newQuestion() {
  a = 2 + Math.floor(Math.random() * 11);   // 2..12
  b = 2 + Math.floor(Math.random() * 9);    // 2..10
  document.getElementById('qbox').innerHTML = a + ' &times; ' + b + ' = ?';
  document.getElementById('roundLbl').textContent = 'QUESTION ' + qn + ' OF ' + TOTAL;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'fb';
  var inp = document.getElementById('ansIn');
  inp.value = ''; inp.focus();
  left = TIME; waiting = false;
  tick();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
}

function tick() {
  document.getElementById('tfill').style.width = (left / TIME * 100) + '%';
  document.getElementById('tlbl').textContent = left + ' second' + (left === 1 ? '' : 's') + ' left';
  if (left <= 0) { timeUp(); return; }
  left = left - 1;
}

function timeUp() {
  clearInterval(timer);
  showResult(false, 'Time up! ' + a + ' \u00d7 ' + b + ' = ' + (a * b));
}

function answer() {
  if (waiting) { return; }
  var v = parseInt(document.getElementById('ansIn').value, 10);
  if (isNaN(v)) { return; }
  clearInterval(timer);
  if (v === a * b) {
    score = score + 1;
    showResult(true, 'Correct \u2014 ' + a + ' \u00d7 ' + b + ' = ' + (a * b));
  } else {
    showResult(false, 'Not quite \u2014 ' + a + ' \u00d7 ' + b + ' = ' + (a * b));
  }
}

function showResult(good, msg) {
  waiting = true;
  var fb = document.getElementById('fb');
  fb.textContent = (good ? '\u2713 ' : '\u2717 ') + msg;
  fb.className = 'fb ' + (good ? 'good' : 'bad');
  document.getElementById('scoreLbl').textContent = 'Score: ' + score;
  setTimeout(next, 1100);
}

function next() {
  qn = qn + 1;
  if (qn <= TOTAL) { newQuestion(); } else { finish(); }
}

function finish() {
  clearInterval(timer);
  var e = document.getElementById('end');
  var emo, msg;
  if (score >= 8) { emo = '\ud83c\udfc6'; msg = 'Sharp! Now imagine printing a whole table without answering a single question yourself.'; }
  else if (score >= 5) { emo = '\ud83d\udcaa'; msg = 'Good sprint. The table that slowed you down \u2014 remember it for class.'; }
  else { emo = '\ud83d\udcd6'; msg = 'Tables need practice \u2014 and luckily, today you write a program that prints any of them instantly.'; }
  var codeBlock = '<div class="code">n = int(input(\'Table of? \'))\nfor i in range(1, 11):\n    print(n, \'x\', i, \'=\', n * i)<\/div>';
  e.innerHTML = '<div class="big">' + emo + '<\/div><h2>' + score + ' out of ' + TOTAL + '<\/h2><p>' + msg + '<\/p><p><b>This prints any full table in three lines \u2014 you write it today:<\/b><\/p>' + codeBlock + '<button onclick="restart()">Play again<\/button>';
  document.getElementById('play').style.display = 'none';
  e.style.display = 'block';
}

function restart() {
  qn = 1; score = 0;
  document.getElementById('play').style.display = 'block';
  document.getElementById('end').style.display = 'none';
  newQuestion();
}

document.getElementById('goBtn').addEventListener('click', answer);
document.getElementById('ansIn').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') { answer(); }
});
qn = 1; score = 0;
newQuestion();
</script>
</body>
</html>
